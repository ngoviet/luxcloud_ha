name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Ra release không cần git trên máy: Actions → Release → Run workflow.
  # Đọc version từ manifest.json, tạo tag `v<version>` trên commit đang chạy
  # (mặc định là đầu `main`) rồi publish release.
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(python -c "import json; print(json.load(open('custom_components/luxcloud_ha/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # HACS picks up the version from manifest.json; a tag that disagrees with it
      # silently offers users the wrong version, so fail the release instead.
      - name: Validate manifest version matches tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$TAG" != "${{ steps.manifest.outputs.version }}" ]; then
            echo "Tag version v$TAG does not match manifest version ${{ steps.manifest.outputs.version }}"
            exit 1
          fi
          echo "Version $TAG validated"

      # Chạy tay: tag lấy từ manifest nên luôn khớp. Không ghi đè tag đã có —
      # quên bump version thì dừng lại thay vì phát hành trùng.
      - name: Create tag from manifest version
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.manifest.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — bump the version in manifest.json first"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # Tag đẩy bằng GITHUB_TOKEN không kích hoạt lại workflow này,
          # nên không bị tạo release hai lần.
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          name: ${{ steps.manifest.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
